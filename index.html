    <script type="text/javascript">
      (function() {
        var base = '/';
        if (window.location.hostname.indexOf('github.io') !== -1) {
          var pathParts = window.location.pathname.split('/').filter(Boolean);
          if (pathParts.length > 0) {
            var firstPart = pathParts[0].toLowerCase();
            var knownRoutes = [
              'admin', 'schedules', 'about', 'contact', 'policy', 
              'privacy', 'terms', 'disclaimer', 'blog', 'careers', 
              'team', 'faqs', 'sitemap'
            ];
            var isRoute = false;
            for (var i = 0; i < knownRoutes.length; i++) {
              if (knownRoutes[i] === firstPart) {
                isRoute = true;
                break;
              }
            }
            if (firstPart.indexOf('-to-') !== -1) {
              isRoute = true;
            }
            if (!isRoute) {
              base = '/' + pathParts[0] + '/';
            }
          }
        }
        var baseTag = document.createElement('base');
        baseTag.href = base;
        document.head.appendChild(baseTag);
      })();
    </script>
    <!-- Single Page Apps for GitHub Pages Routing Hack -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
